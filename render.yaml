databases:
  - name: candlelight_db
    databaseName: candlelight_db
    user: candlelight_user
    plan: free
    ipAllowList: []

services:
  - type: web
    name: candlelight-blog
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "./build.sh"
    startCommand: "gunicorn my_blog.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: candlelight_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: PYTHON_VERSION
        value: "3.11.9"
    autoDeploy: true
