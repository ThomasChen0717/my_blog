worker_processes 1;

pid run/nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 256;
}

http {
    include /opt/homebrew/etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format local '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

    access_log logs/access.log local;

    sendfile on;
    keepalive_timeout 65;

    map $request_method $auth_limit_key {
        default "";
        POST $binary_remote_addr;
    }

    limit_req_zone $auth_limit_key zone=auth_limit:10m rate=5r/m;

    geo $blocked_ip {
        default 0;
        127.0.0.2 1;
    }

    upstream django_local {
        server 127.0.0.1:8000;
    }

    server {
        listen 127.0.0.1:8080;
        server_name localhost 127.0.0.1;

        if ($blocked_ip) {
            return 403;
        }

        location = /health/ {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok\n";
        }

        location /static/ {
            alias /Users/styleys/Documents/projects/my_blog/static/;
            access_log off;
            expires 1h;
        }

        location /media/ {
            alias /Users/styleys/Documents/projects/my_blog/media/;
            access_log off;
            expires 1h;
        }

        location ^~ /admin/ {
            allow 127.0.0.1;
            deny all;

            proxy_pass http://django_local;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location ~ ^/blog/(login|register)/$ {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://django_local;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        location / {
            proxy_pass http://django_local;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
}
